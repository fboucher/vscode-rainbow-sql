name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' must match package version 'v$VERSION'."
            exit 1
          fi

      - name: Package extension
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX_PATH="rainbow-sql-$VERSION.vsix"
          echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
          npx --yes @vscode/vsce package --out "$VSIX_PATH"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "${{ steps.package.outputs.vsix_path }}"

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.vsix_path }}" --clobber
